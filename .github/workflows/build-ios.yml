
name: Build iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build ROBO INDIA IPA
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Find Xcode Project
        id: project
        shell: bash
        run: |
          PROJECT=$(find . -maxdepth 4 -name "*.xcodeproj" -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "ERROR: No .xcodeproj found."
            exit 1
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT"

      - name: Build Unsigned IPA
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.project }}"
          SCHEME="3105"
          DERIVED="$RUNNER_TEMP/DerivedData"
          mkdir -p "$RUNNER_TEMP/Payload"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP=$(find "$DERIVED/Build/Products/Release-iphoneos" \
            -maxdepth 1 -name "*.app" -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: Built .app not found."
            exit 1
          fi

          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry ROBO-INDIA.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROBO-INDIA-IPA
          path: ${{ runner.temp }}/ROBO-INDIA.ipa
          if-no-files-found: error
          retention-days: 7
